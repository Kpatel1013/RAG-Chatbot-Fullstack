<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Chatbot — Demo Walkthrough</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: #e6edf3;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        width: min(960px, 100%);
        padding: 1.5rem;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.35rem;
      }
      p {
        margin: 0 0 1rem;
        color: #8b949e;
        font-size: 0.95rem;
      }
      video {
        width: 100%;
        border-radius: 8px;
        background: #000;
        display: block;
      }
      a {
        color: #58a6ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .back {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Document-Grounded RAG Chatbot — Walkthrough</h1>
      <p>~2 min demo with voiceover. Press play (unmute for audio).</p>
      <video
        controls
        playsinline
        preload="metadata"
        src="demo-walkthrough.mp4"
      >
        Your browser does not support video playback.
        <a href="demo-walkthrough.mp4">Download the MP4</a>
      </video>
      <p class="back">
        <a href="https://github.com/Kpatel1013/RAG-Chatbot-Fullstack"
          >← Back to repository</a
        >
      </p>
    </main>
  </body>
</html>
